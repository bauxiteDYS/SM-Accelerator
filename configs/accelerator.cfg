// Accelerator configuration.
// Installed at addons/sourcemod/configs/accelerator.cfg.
// Restart the server after changing this file.
"Accelerator"
{
	// SteamID64 of the account that owns uploaded crash reports.
	// Leave empty to upload without an associated account.
	"MinidumpAccount"		""

	// Keep crash dumps and their metadata on the server after processing.
	// Completed dumps get a .processed sidecar to prevent resubmission.
	// Failed uploads remain unmarked and eligible for retry within the limit.
	"MinidumpKeepDumps"		"yes"

	// Disable all uploads (dumps, metadata, symbols, and binaries).
	// Dump generation continues; no existing files are processed or deleted,
	// regardless of MinidumpKeepDumps. Set to "yes" for local-only operation.
	"MinidumpDisableUpload"	"yes"

	// Maximum number of unprocessed dumps to attempt per extension load.
	// Newest modification time first; failures and server skips count too.
	// Older dumps are left untouched, even when MinidumpKeepDumps is "no".
	// Range: 1-1000. Use MinidumpDisableUpload for no uploads.
	"MinidumpUploadLimit"		"2"

	// Windows only: capture selected native exceptions before engine handlers
	// can consume them. Enabled by default for legacy Accelerator compatibility.
	// Can also capture handled/recoverable exceptions and produce duplicate dumps.
	// "no" relies on the unhandled filter (except fatal Sys_Error); some games
	// may then crash without an Accelerator dump. Ignored on Linux.
	"MinidumpWindowsFirstChance"	"yes"

	// Ask the crash service what to upload before submitting a dump.
	// "yes" or "1" enables this; "no" or "0" disables it.
	"MinidumpPresubmit"		"yes"

	// Module upload scope: 0 = disabled, 1 = system only,
	// 2 = system + game, 3 = system + game + addons/extensions.
	// Applies to both symbol and binary uploads during presubmission.
	// Symbol generation is only supported on Linux.
	"MinidumpSymbolUpload"	"3"

	// Allow binary uploads requested by the crash service, within the scope above.
	// Only used when presubmission is enabled.
	"MinidumpBinaryUpload"	"yes"

	// Advanced: upload endpoints. Use HTTPS to protect crash data in transit.
	"MinidumpUrl"			"https://crash.limetech.org/submit"
	"MinidumpSymbolUrl"		"https://crash.limetech.org/symbols/submit"
	"MinidumpBinaryUrl"		"https://crash.limetech.org/binary/submit"
}
