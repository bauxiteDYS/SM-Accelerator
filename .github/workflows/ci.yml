name: CI
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [windows, linux]
        sourcemod: ['1.11', '1.12', '1.13']
    uses: ./.github/workflows/build-extension.yml
    with:
      platform: ${{ matrix.platform }}
      sourcemod: ${{ matrix.sourcemod }}
      architecture: both
