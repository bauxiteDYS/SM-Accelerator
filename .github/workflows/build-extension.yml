name: Build extension
on:
  workflow_call:
    inputs:
      platform:
        type: string
        required: true
      sourcemod:
        type: string
        required: true
      architecture:
        type: string
        default: both
permissions:
  contents: read
jobs:
  build:
    runs-on: ${{ inputs.platform == 'windows' && 'windows-latest' || 'ubuntu-latest' }}
    container: ${{ inputs.platform == 'linux' && 'ghcr.io/alliedmodders/build-containers/debian11-clang22:latest' || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        if: inputs.platform == 'windows'
        with:
          python-version: '3.12'
      - name: Linux prerequisites
        if: inputs.platform == 'linux'
        run: |
          bash dockerbuild/install-linux-deps.sh
          # checkout's temporary Git HOME may differ from this container's HOME.
          # Trust this mounted repository only, never all directories.
          git config --global --add safe.directory "$(pwd -P)"
          echo "CC=clang-22" >> "$GITHUB_ENV"
          echo "CXX=clang++-22" >> "$GITHUB_ENV"
      - name: Required regression tests
        if: inputs.platform == 'linux'
        shell: bash
        env:
          ACCELERATOR_REQUIRE_NATIVE_TESTS: '1'
          ACCELERATOR_REQUIRE_GIT_TESTS: '1'
        run: python3 -m unittest discover -s tests -v
      - name: Required Windows regression tests
        if: inputs.platform == 'windows'
        shell: pwsh
        env:
          ACCELERATOR_REQUIRE_NATIVE_TESTS: '1'
          ACCELERATOR_REQUIRE_GIT_TESTS: '1'
        run: |
          $finder = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $finder -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw "MSVC x86/x64 tools not found" }
          $script = Join-Path $env:RUNNER_TEMP "accelerator-tests.cmd"
          @"
          @echo off
          call "$vs\VC\Auxiliary\Build\vcvars64.bat" >nul
          if errorlevel 1 exit /b %errorlevel%
          python -m unittest discover -s tests -v
          "@ | Set-Content $script
          & cmd.exe /d /c $script
          exit $LASTEXITCODE
      - name: Build and validate packages
        shell: bash
        run: python3 build.py --sm-version "${{ inputs.sourcemod }}" --arch "${{ inputs.architecture }}"
      - name: Installable archive
        uses: actions/upload-artifact@v7
        with:
          name: accelerator-${{ inputs.platform }}-sm${{ inputs.sourcemod }}-${{ inputs.architecture }}
          path: build/*/dist/*-package.zip
          archive: false
          if-no-files-found: error
      - name: Matching symbols and binaries
        uses: actions/upload-artifact@v7
        with:
          name: symbols-${{ inputs.platform }}-sm${{ inputs.sourcemod }}-${{ inputs.architecture }}
          path: build/*/dist/*-symbols.zip
          archive: false
          if-no-files-found: error
