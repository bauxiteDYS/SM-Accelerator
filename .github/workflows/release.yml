name: Release
on:
  workflow_dispatch:
  push:
    branches: [master, release_ci]
permissions:
  contents: read
jobs:
  main-ci:
    uses: ./.github/workflows/ci.yml
  release:
    needs: [main-ci]
    runs-on: ubuntu-latest
    steps:
      # Download the already-validated archives from all six build jobs.
      # Preserve their contents: no re-zipping with windows/ or linux/ prefixes.
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish installation archives to legacy build service (optional)
        env:
          UPLOAD_PASSWORD: ${{ secrets.UPLOAD_PASSWORD }}
          RELEASE_BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          if [ -z "$UPLOAD_PASSWORD" ]; then
            echo "Legacy publication disabled; installation and symbol archives remain in this run's artifacts."
            exit 0
          fi
          while IFS= read -r -d '' package; do
            curl --fail --show-error --silent --connect-timeout 15 --max-time 300 \
              --user "builds:${UPLOAD_PASSWORD}" --header "Content-Type: application/zip" \
              --data-binary "@${package}" \
              --url-query "project=accelerator" --url-query "branch=${RELEASE_BRANCH}" \
              --url-query "filename=$(basename "$package")" \
              "https://builds.limetech.io/upload.php"
          done < <(find artifacts -type f -name '*-package.zip' -print0)
